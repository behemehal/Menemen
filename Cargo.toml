[package]
name = "menemen"
version = "1.0.3"
authors = ["Behemehal", "Ahmetcan Aksu"]
edition = "2021"
description = "A streaming http request library"
categories = ["network-programming"]
keywords = ["network", "http", "stream"]
license = "GPL-2.0"
readme = "README.md"
documentation = "https://docs.rs/menemen"
repository = "https://github.com/behemehal/Menemen"

[features]
default = ["async", "json"]
https = ["native-tls"]
https-async = ["tokio-native-tls"]
json = ["serde", "serde_json"]
async = ["tokio"]
blocking = []

[dependencies]
anyhow = "1.0.86"
bufstream = { version = "0.1.4" }
native-tls = { version = "0.2.12", optional = true }
tokio = { version = "1.39.2", features = [
    "net",
    "io-util",
    "fs",
], optional = true }
tokio-native-tls = { version = "0.3.1", optional = true }
serde = { version = "1.0.207", features = ["derive"], optional = true }
serde_json = { version = "1.0.69", optional = true }

[dev-dependencies]
libflate = "2.1.0"
tokio = { version = "1.39.2", features = ["full"] }
tokio-macros = "2.4.0"
serde = { version = "1.0.207", features = ["derive"] }

[[example]]
name = "download_file"
path = "examples/download_file.rs"

[[example]]
name = "download_file_async"
path = "examples/download_file_async.rs"
reqired-features = ["async"]

[[example]]
name = "echo"
path = "examples/echo.rs"

[[example]]
name = "parse_url"
path = "examples/parse_url.rs"

[[example]]
name = "post"
path = "examples/post.rs"

[[example]]
name = "gzip"
path = "examples/gzip.rs"

[[example]]
name = "json"
path = "examples/json.rs"
reqired-features = ["json"]
