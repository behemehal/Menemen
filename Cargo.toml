[package]
name = "menemen"
version = "2.0.0"
authors = ["Behemehal", "Ahmetcan Aksu"]
edition = "2021"
description = "Menemen is a lightweight streaming HTTP/HTTPS client for Rust with both blocking and async modes."
categories = ["network-programming"]
keywords = ["http", "stream", "async", "blocking", "client"]
license = "GPL-2.0"
readme = "README.md"

# Keep the published crate small: the logo is 78% of the tarball and crates.io
# resolves README images against the repository anyway. Editor and OS metadata
# have no business in a dependency.
exclude = [
    "image.png",
    ".vscode/",
    ".idea/",
    "**/.DS_Store",
]
documentation = "https://docs.rs/menemen"
repository = "https://github.com/behemehal/Menemen"

[features]
default = ["blocking", "json", "multipart"]

# CLI tool feature
cli = ["clap", "clap_complete", "blocking", "https", "json", "multipart"]

# User-facing feature
https = []

# Transport modes. `blocking` is the standard mode; `async` is opt-in and
# currently replaces it rather than sitting alongside it, so enabling `async`
# requires `default-features = false`.
blocking = ["dep:native-tls"]
async = ["tokio", "dep:tokio-native-tls"]

json = ["serde", "serde_json"]
multipart = ["rand", "mime_guess"]
gzip = ["libflate"]
danger-transport-no-tls = [
] # # Allow client to send requests to https endpoints without TLS (not recommended)

[dependencies]
native-tls = { version = "0.2.18", optional = true }
tokio = { version = "1.53", features = [
    "net",
    "io-util",
    "fs",
    "time",
    "rt",
], optional = true }
tokio-native-tls = { version = "0.3.1", optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1.0.151", optional = true }
rand = { version = "0.10.2", optional = true }
mime_guess = { version = "2.0.5", optional = true }
libflate = { version = "2.3", optional = true }
bytes = "1.12"
pin-project-lite = "0.2.17"
clap = { version = "4.6", features = ["derive", "cargo"], optional = true }
clap_complete = { version = "4.6", optional = true }

[dev-dependencies]
tokio = { version = "1.53", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
indicatif = "0.18.6"

# docs.rs builds with default features; document the standard blocking mode
# with every optional capability turned on.
[package.metadata.docs.rs]
all-features = false
features = ["blocking", "https", "json", "multipart", "gzip"]
rustdoc-args = ["--cfg", "docsrs"]

[[example]]
name = "download_file"
path = "examples/download_file.rs"

[[example]]
name = "body"
path = "examples/body.rs"

[[example]]
name = "chunked"
path = "examples/chunked.rs"

[[example]]
name = "download_file_async"
path = "examples/download_file_async.rs"
required-features = ["async"]

[[example]]
name = "echo"
path = "examples/echo.rs"

[[example]]
name = "form_data"
path = "examples/form_data.rs"

[[example]]
name = "parse_url"
path = "examples/parse_url.rs"

[[example]]
name = "post"
path = "examples/post.rs"

[[example]]
name = "gzip"
path = "examples/gzip.rs"

[[example]]
name = "json"
path = "examples/json.rs"
required-features = ["json", "async"]

[[example]]
name = "long_polling"
path = "examples/long_polling.rs"

[[example]]
name = "multipart_form_data"
path = "examples/multipart_form_data.rs"

[[example]]
name = "methods"
path = "examples/methods.rs"

[[bin]]
name = "menemen"
path = "src/bin/menemen.rs"
required-features = ["cli", "blocking"]
