[package]
name = "menemen"
version = "2.0.0"
authors = ["Behemehal", "Ahmetcan Aksu"]
edition = "2021"
description = "A streaming http request library"
categories = ["network-programming"]
keywords = ["network", "http", "stream"]
license = "GPL-2.0"
readme = "README.md"
documentation = "https://docs.rs/menemen"
repository = "https://github.com/behemehal/Menemen"

[features]
default = ["json", "multipart", "async"]
https = ["native-tls"]
https-async = ["tokio-native-tls"]
json = ["serde", "serde_json"]
async = ["tokio", "futures"]
blocking = []
multipart = ["rand", "mime_guess"]
gzip = ["libflate"]

[dependencies]
anyhow = "1.0.95"
bufstream = { version = "0.1.4" }
native-tls = { version = "0.2.13", optional = true }
tokio = { version = "1.40.0", features = [
    "net",
    "io-util",
    "fs",
], optional = true }
tokio-native-tls = { version = "0.3.1", optional = true }
serde = { version = "1.0.217", features = ["derive"], optional = true }
serde_json = { version = "1.0.138", optional = true }
rand = { version = "0.9.0", optional = true }
mime_guess = { version = "2.0.5", optional = true }
libflate = { version = "2.1.0", optional = true }
futures = { version = "0.3.31", optional = true }

[dev-dependencies]
tokio = { version = "1.39.2", features = ["full"] }
tokio-macros = "2.5.0"
serde = { version = "1.0.207", features = ["derive"] }
indicatif = "0.17.11"

[[example]]
name = "download_file"
path = "examples/download_file.rs"

[[example]]
name = "download_file_async"
path = "examples/download_file_async.rs"
required-features = ["async"]

[[example]]
name = "echo"
path = "examples/echo.rs"

[[example]]
name = "parse_url"
path = "examples/parse_url.rs"

[[example]]
name = "post"
path = "examples/post.rs"

[[example]]
name = "gzip"
path = "examples/gzip.rs"

[[example]]
name = "json"
path = "examples/json.rs"
reqired-features = ["json", "async"]
